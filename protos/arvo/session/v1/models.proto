syntax = "proto3";

package arvo.session.v1;

// A rule trading against a venue, live.

message StartRequest {
  // The finding whose rule runs: its selected experiment, warmed on the
  // library from the finding's own start to today.
  string finding = 1;
  // `alpaca-paper`, `alpaca-live`, or `robinhood-<last four>`.
  string executor = 2;
}

message SessionId {
  string id = 1;
}

// The kill switch (#127): arm the gate, then flatten everything the session
// holds. The halt is in force either way; what the venue would not exit is
// named in the session record.
message HaltRequest {
  string id = 1;
  // Why, for the record. Empty means "a person pressed it".
  string reason = 2;
}

message SessionStatus {
  string id = 1;
  string finding = 2;
  string executor = 3;
  string instrument = 4;
  string strategy = 5;
  string started_at = 6;
  // starting, running, frozen, halted, stopped or failed.
  string state = 7;
  uint32 signals = 8;
  uint32 submitted = 9;
  uint32 refused = 10;
  uint32 fills = 11;
  // Why the gate halted, when it did.
  optional string halted = 12;
  optional string last_error = 13;
  optional string last_bar = 14;
  // What the gate and the venue disagreed about, while frozen (#187).
  optional string frozen = 15;
  // Whether a frozen session has been reconciled, so ResumeSession is allowed.
  bool reconciled = 16;
  // Whether the rule is still the rule its finding described: holding,
  // diverging or inconclusive, judged from the session's own trades against
  // the finding's out-of-sample expectation (#221). Never a risk limit.
  string verdict = 17;
  // Why it is diverging, when it is: what was seen against what was expected.
  optional string verdict_reason = 18;
  // The gate's limits this session is within four fifths of (#191), in the
  // gate's words: "drawdown 8.1% of a 10.0% limit". Empty while halted.
  repeated string warnings = 19;
}

// The promotion gate's answer for one finding and one executor (#194).
message PromotionView {
  bool allowed = 1;
  // Every reason it is not, in the gate's words. Empty when allowed.
  repeated string reasons = 2;
  // The finding's own verdict: Supported, NotSupported or Inconclusive.
  // Empty when the finding cannot be opened.
  string verdict = 3;
  // Days the finding has run on paper, by its paper record; absent when it
  // has not.
  optional int64 paper_days = 4;
  // The paper session's last verdict against the finding (holding,
  // diverging, inconclusive), when it has one.
  optional string paper_verdict = 5;
}

message SessionList {
  repeated SessionStatus sessions = 1;
}
