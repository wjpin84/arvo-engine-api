syntax = "proto3";

package arvo.platform.v1;

// Same package as the other view files: one namespace, split by domain so
// a reader finds a shape where its subject lives.

// The engine's own moving parts, as a front end shows them.

message JobView {
  string id = 1;
  string label = 2;
  // The project script this job runs, when it is a scheduled script
  // rather than one of the runtime's own. `None` for a built-in.
  optional string script = 3;
  // The cron expression it runs on, as the person wrote it. `None` for a
  // job on a fixed interval, where `every_secs` is the cadence.
  optional string cron = 4;
  uint64 every_secs = 5;
  bool running = 6;
  uint32 runs = 7;
  optional string last_started = 8;
  optional string last_finished = 9;
  // One line from the last run that succeeded.
  optional string last_result = 10;
  // Why the last run failed, when it did.
  optional string last_error = 11;
  optional string next_run = 12;
}

message PluginStatusView {
  oneof of {
    PluginStatusViewReachable reachable = 1;
    PluginStatusViewUnreachable unreachable = 2;
  }
}

message PluginStatusViewReachable {
  string name = 1;
  string version = 2;
  repeated string capabilities = 3;
}

message PluginStatusViewUnreachable {
  string reason = 1;
}

message PluginView {
  string id = 1;
  string address = 2;
  PluginStatusView status = 3;
}

// One signal a plugin publishes, as it stands right now (#163).
//
// A signal that is declared and has no value is shown with none, not with
// a zero and not with whatever it last said. That is the invariant made
// visible: a reader looking at this list should be able to see the
// difference between "nothing to say" and "saying nothing has changed".
message SignalView {
  string name = 1;
  string description = 2;
  // Whether each value is computed from what was known at that instant.
  // A study may gate on a causal signal and never on a descriptive one.
  bool causal = 3;
  // Why it is not causal, in the provider's own words. Empty when it is.
  string because = 4;
  // What computes it, by name and version.
  string engine = 5;
  // The instant the value describes, empty when there is no value.
  string at = 6;
  // `None` is the answer for a signal that is declared and silent, and
  // for one whose provider has gone away.
  optional double value = 7;
}

// One strategy an extension contributes as a document (#162).
//
// Data Arvo reads, like a theme: there is no code in it and none runs in
// the window. A document this build cannot offer is listed with the reason
// rather than dropped, so a person can see why their catalog is one entry
// short.
message StrategyContributionView {
  // Namespaced by its extension: `their-catalog.fast-cross`.
  string id = 1;
  string label = 2;
  string premise = 3;
  // `grid` or `rules`, as the document names its kind.
  string kind = 4;
  string interval = 5;
  // Configurations the search holds; zero for a kind that is not a grid.
  uint32 configurations = 6;
  // Why it is not in the strategy picker. `None` means it is.
  optional string problem = 7;
}

// A list, as a message.
//
// An RPC returns one message, never a bare repeated field, so a call that
// answers with a list needs a name for the list. The wrapper is also where
// a total or a "when this was read" goes later, without renumbering what is
// already here.
message JobsView {
  repeated JobView jobs = 1;
}

// The plugins this engine hosts. A list, as a message; see `JobsView`.
message PluginsView {
  repeated PluginView plugins = 1;
}

// What the plugins publish. A list, as a message; see `JobsView`.
message SignalsView {
  repeated SignalView signals = 1;
}

// What one extension contributes to the strategy picker.
//
// Its own message because a proto map's value cannot itself be repeated.
message StrategyContributionsView {
  repeated StrategyContributionView contributions = 1;
}

// Every extension's contributions, by extension name.
message ExtensionStrategiesView {
  map<string, StrategyContributionsView> by_extension = 1;
}

// One vendor as the Accounts view shows it: what it needs from the
// person, whether it has it, and what it gives back.
message AccountView {
  // The vendor's id: `robinhood`, `alpaca`, `yahoo`.
  string id = 1;
  string label = 2;
  // `none`, `sign_in` or `keys`.
  string credential = 3;
  // Whether the credential is there and the vendor can be used. Always
  // true for one needing nothing.
  bool connected = 4;
  // In words: `bars`, `quotes`, `holdings`, `option quotes`.
  repeated string provides = 5;
  // The sources under this vendor, by label.
  repeated string sources = 6;
  // When one vendor login holds several accounts that each need their own
  // credential — Alpaca's paper and live, from one login but two key pairs
  // — each is one of these. Empty for a vendor with a single credential.
  repeated SubAccountView subaccounts = 7;
}

// One account under a vendor that has more than one: its own credential and
// its own state, sharing the vendor's row.
message SubAccountView {
  // The vendor's spelling: `paper`, `live`.
  string id = 1;
  string label = 2;
  bool connected = 3;
  // Real money, so the window can mark it. Paper is not.
  bool live = 4;
}

// A person's vendors. A list, as a message; see `JobsView`.
message AccountsView {
  repeated AccountView accounts = 1;
}

// Something that happened while nobody was looking: a plugin dropped, a
// broker session ended (#150).
//
// Every other view answers a question a front end asked. This is the other
// direction, so it arrives on a stream rather than as a reply.
//
// # Why the text is in the payload
//
// `title` and `detail` are filled in by the engine rather than derived from
// the kind by whoever renders it. There are two renderers — the OS
// notification and the in-app alerts list — and text derived twice is text
// that drifts. The kind is left for what a renderer needs *structurally*:
// the status bar needs to know a feed is down, not how to phrase it.
message EventView {
  EventKindView kind = 1;
  string title = 2;
  string detail = 3;
  SeverityView severity = 4;
}

// What happened, structurally.
message EventKindView {
  oneof of {
    PluginEvent plugin = 1;
    FeedEvent feed = 2;
    StreamEvent stream = 3;
    FindingsEvent findings = 4;
    SessionEvent session = 5;
  }
}

message PluginEvent {
  string id = 1;
  bool reachable = 2;
}

// A broker connection came up or went away. `connected: false` covers both
// signing out and a session that expired underneath you — which of the two
// it was is in the detail, because the difference matters to a person
// reading it and not at all to the status bar.
message FeedEvent {
  string id = 1;
  bool connected = 2;
}

// The live price stream stopped or came back.
//
// Its own kind rather than another feed: the status bar reads a feed event
// to decide whether a broker session is held, and a price socket dropping
// says nothing about that. Folding the two together would have a Yahoo
// reconnect claim you had been signed out of your broker.
//
// Worth an event at all because the failure is otherwise invisible: a dead
// socket looks exactly like a market where nothing is trading.
message StreamEvent {
  bool live = 1;
}

// Stored findings went stale since they were last checked — their data
// changed or disappeared. The count is how many were newly so.
message FindingsEvent {
  uint32 count = 1;
}

// A trading session changed state: starting, running, stopped, halted or
// failed.
message SessionEvent {
  string id = 1;
  string state = 2;
}

// Whether this is worth interrupting someone for.
//
// The one thing that decides it: a warning raises an OS notification, info
// only lands in the alerts list. Both are always recorded, so the
// distinction costs nothing but noise.
enum SeverityView {
  SEVERITY_VIEW_UNSPECIFIED = 0;
  SEVERITY_VIEW_INFO = 1;
  SEVERITY_VIEW_WARNING = 2;
}
