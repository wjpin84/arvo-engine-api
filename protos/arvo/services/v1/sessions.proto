syntax = "proto3";

package arvo.services.v1;

import "arvo/common/v1/models.proto";
import "arvo/session/v1/models.proto";

service Sessions {
  // Starts a finding's rule against a venue. Answers as soon as the session
  // thread is up; a finding that cannot run shows as `failed` in ListSessions.
  rpc StartSession(arvo.session.v1.StartRequest) returns (arvo.session.v1.SessionStatus);
  // Stops after the current poll. Positions are left as they are.
  rpc StopSession(arvo.session.v1.SessionId) returns (arvo.session.v1.SessionStatus);
  // Makes a frozen session's book agree with the venue's. It stays frozen.
  rpc ReconcileSession(arvo.session.v1.SessionId) returns (arvo.session.v1.SessionStatus);
  // Lets a frozen, reconciled session take entries again. Refused before a
  // reconcile: resuming against a book the venue disagrees with is the state
  // the freeze exists to prevent.
  rpc ResumeSession(arvo.session.v1.SessionId) returns (arvo.session.v1.SessionStatus);
  // The kill switch: stops the session taking entries and flattens what it
  // holds. Exits that the venue refuses are named in the session record; the
  // halt stands either way. Not lifted from here.
  rpc HaltSession(arvo.session.v1.HaltRequest) returns (arvo.session.v1.SessionStatus);
  rpc ListSessions(arvo.common.v1.Empty) returns (arvo.session.v1.SessionList);
  // What the promotion gate would say to StartSession with the same request,
  // without starting anything (#194, #199): whether the finding may go to
  // that executor, every reason it may not, and what the gate looked at.
  // Paper needs no promotion and is always allowed.
  rpc CheckPromotion(arvo.session.v1.StartRequest) returns (arvo.session.v1.PromotionView);
  // Stop serving and exit. The front end that started this engine asks before
  // it kills: a killed process runs no destructors, so the providers it
  // supervises would be orphaned (ADR-0029, ADR-0023 point 5).
  rpc Shutdown(arvo.common.v1.Empty) returns (arvo.common.v1.Empty);
}
