syntax = "proto3";

package arvo.services.v1;

import "arvo/common/v1/models.proto";
import "arvo/market/v1/models.proto";
import "arvo/research/v1/models.proto";
import "arvo/platform/v1/views.proto";
import "arvo/research/v1/views.proto";

service Research {
  rpc ListStrategies(arvo.common.v1.Empty) returns (arvo.research.v1.Strategies);
  rpc ListInstruments(arvo.common.v1.Empty) returns (arvo.market.v1.Instruments);
  rpc ListFindings(arvo.common.v1.Empty) returns (arvo.research.v1.Findings);
  rpc OpenFinding(arvo.research.v1.FindingId) returns (arvo.research.v1.Finding);
  // Search a strategy's grid on one instrument, choose in-sample, judge
  // out-of-sample. Seconds to a minute.
  rpc RunStudy(arvo.research.v1.RunRequest) returns (arvo.research.v1.Finding);
  // Re-select on a rolling schedule across the whole history. Slower by
  // roughly the number of folds.
  rpc RunWalkForward(arvo.research.v1.RunRequest) returns (arvo.research.v1.Finding);
  // Record evidence computed elsewhere. Arvo judges it with a study's
  // criteria, saves it as the author's finding held to the author's whole
  // search, and answers with the finding it made of it (ADR-0026).
  rpc RecordFinding(arvo.research.v1.ReportRequest) returns (arvo.research.v1.Finding);
  // Keep a file with a finding: a report, a figure, the trades. Stored once
  // by content hash; the finding lists it (#157).
  rpc AttachFile(arvo.research.v1.AttachRequest) returns (arvo.research.v1.Attachments);
  // The project's rulesets and the rules they may search (#146, #127).
  rpc ListRulesets(arvo.common.v1.Empty) returns (arvo.research.v1.Rulesets);
  rpc ReadRuleset(arvo.research.v1.RulesetPath) returns (arvo.research.v1.RulesetForm);
  rpc WriteRuleset(arvo.research.v1.RulesetForm) returns (arvo.research.v1.Ruleset);
  rpc ListRules(arvo.common.v1.Empty) returns (arvo.research.v1.Rules);
  // The project's rules written as data (#225), with any reason one cannot
  // run.
  rpc ListRuleFiles(arvo.common.v1.Empty) returns (arvo.research.v1.RuleFiles);
  // Writes one, refusing anything the engine would not run. The picker
  // re-reads at once, so a ruleset written next may name it.
  rpc WriteRule(arvo.research.v1.RuleText) returns (arvo.research.v1.RuleFile);
  // Translates a Pine v5 strategy into a rule (#228), refusing every
  // construct it cannot say by name. Nothing is fetched, run or written:
  // the rule it returns goes to WriteRule to be kept.
  rpc TranslatePine(arvo.research.v1.PineScript) returns (arvo.research.v1.PineTranslation);
  rpc GetRiskModel(arvo.common.v1.Empty) returns (arvo.research.v1.RiskModel);
  // The workbench's own views (#127 stage 2): what the window renders, from
  // the same runs an agent's RunStudy performs.
  rpc ViewStudy(arvo.research.v1.StudyRequest) returns (arvo.research.v1.StudyView);
  rpc ViewWalkForward(arvo.research.v1.StudyRequest) returns (arvo.research.v1.WalkForwardView);
  rpc ViewPanel(arvo.common.v1.Empty) returns (arvo.research.v1.PanelView);
  // A panel over one of the project's universes (#227), under a rule or the
  // default, recorded as a finding that names the universe and its reason.
  rpc RunPanel(arvo.research.v1.PanelRequest) returns (arvo.research.v1.PanelView);
  rpc ViewBook(arvo.research.v1.BookRequest) returns (arvo.research.v1.StudyView);
  rpc ViewHistory(arvo.common.v1.Empty) returns (arvo.research.v1.HistoryView);
  rpc ViewRecord(arvo.research.v1.FindingId) returns (arvo.research.v1.RecordView);
  rpc ViewReplay(arvo.research.v1.FindingId) returns (arvo.research.v1.ReplayView);
  rpc ViewComparison(arvo.research.v1.FindingIds) returns (arvo.research.v1.ComparisonView);
  // The library's bars over a window, read-only (#195): what a study saw,
  // for an agent that can run but could not look. Nothing here fetches.
  rpc ReadBars(arvo.research.v1.BarsRequest) returns (arvo.research.v1.BarsView);
  // The regime of each bar in the window, labelled after the fact.
  rpc ViewRegime(arvo.research.v1.BarsRequest) returns (arvo.research.v1.RegimeView);
  // The review after the close for a day (#217), written if it was not, read
  // as written if it was. What the sessions did, against what the findings
  // said; nothing here reaches a session.
  rpc ViewReview(arvo.research.v1.ReviewRequest) returns (arvo.research.v1.ReviewView);
  // The leaderboard (#226): every comparable finding in the one order the
  // research tier ranks by. Reads the store; reaches nothing.
  rpc RankFindings(arvo.research.v1.RankRequest) returns (arvo.research.v1.Ranking);
  rpc ViewProblems(arvo.common.v1.Empty) returns (arvo.research.v1.ProblemsView);
  rpc ListAttachments(arvo.research.v1.FindingId) returns (arvo.research.v1.Attachments);
  // What happened, as it happens: every event the engine raises, as a View
  // of kind EventView (#150). A session changing state is the first.
  rpc Subscribe(arvo.common.v1.Empty) returns (stream arvo.platform.v1.EventView);
}

// The research files a person asks for: an experiment someone sent, and
// what a finding turns into on disk.
//
// Behind the *control* token, not the research one. Import is on the
// research boundary's forbidden list — an agent may run what this build
// implements, not a file someone sent it — and an export writes to the
// person's own folder.
service ResearchFiles {
  // Running an imported experiment, and the files a finding turns into. Each
  // export answers with a path the caller reveals; the engine writes, the
  // front end shows.
  rpc RunSharedExperiment(arvo.research.v1.SharedExperiment) returns (arvo.research.v1.StudyView);
  rpc ExportTrades(arvo.research.v1.TradeExport) returns (arvo.common.v1.ExportedPath);
  rpc ExportExperiment(arvo.research.v1.FindingId) returns (arvo.common.v1.ExportedPath);
  rpc ComposeReport(arvo.research.v1.ReportFigure) returns (arvo.common.v1.ExportedPath);
  rpc AttachmentPath(arvo.research.v1.AttachmentRef) returns (arvo.common.v1.ExportedPath);
}
