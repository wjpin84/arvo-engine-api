syntax = "proto3";

package arvo.services.v1;

import "arvo/common/v1/common.proto";
import "arvo/market/v1/market.proto";
import "arvo/platform/v1/platform.proto";
import "arvo/portfolio/v1/portfolio.proto";
import "arvo/research/v1/research.proto";

// The data library and the sources that fill it.
//
// Behind the control token, not the research one. Fetching changes the
// library and makes existing findings stale, which is a person's decision
// (ADR-0016); an agent holding engine.json cannot reach any of this.
service Data {
  rpc ViewLibrary(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc ListSources(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc SearchInstruments(arvo.market.v1.InstrumentSearch) returns (arvo.common.v1.View);
  rpc FetchBars(arvo.market.v1.FetchRequest) returns (arvo.common.v1.View);
  rpc CompareSources(arvo.market.v1.CompareRequest) returns (arvo.common.v1.View);
  // Accounts and their credentials (ADR-0028). The engine holds every
  // credential; BeginSignIn answers with a URL and reports the outcome as an
  // event rather than making the caller wait for a person.
  rpc ListAccounts(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc BeginSignIn(arvo.platform.v1.VendorId) returns (arvo.platform.v1.SignIn);
  rpc DisconnectAccount(arvo.platform.v1.VendorProfile) returns (arvo.common.v1.Empty);
  rpc StoreAccountKeys(arvo.platform.v1.AccountKeys) returns (arvo.common.v1.Empty);
  // Holdings: files the person exported, or ones a connected vendor wrote.
  // Read-only; nothing here places, cancels or modifies an order.
  rpc ListPortfolios(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc SyncAccounts(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc SyncPortfolio(arvo.portfolio.v1.PortfolioName) returns (arvo.common.v1.View);
  // Running an imported experiment, and the files a finding turns into. Each
  // export answers with a path the caller reveals; the engine writes, the
  // front end shows.
  rpc RunSharedExperiment(arvo.research.v1.SharedExperiment) returns (arvo.common.v1.View);
  rpc ExportTrades(arvo.research.v1.TradeExport) returns (arvo.common.v1.ExportedPath);
  rpc ExportExperiment(arvo.research.v1.FindingId) returns (arvo.common.v1.ExportedPath);
  rpc ComposeReport(arvo.research.v1.ReportFigure) returns (arvo.common.v1.ExportedPath);
  rpc AttachmentPath(arvo.research.v1.AttachmentRef) returns (arvo.common.v1.ExportedPath);
  // The engine's own background jobs. A front end shows these beside its own:
  // a job lives where its work does, and the list is a merge.
  rpc ListJobs(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc RunJob(arvo.platform.v1.JobId) returns (arvo.common.v1.Empty);
  // The plugins this engine hosts (ADR-0029). It probes them, supervises them,
  // and holds the credential each call may use; a front end reads and asks for
  // a reconcile after it has changed what is installed.
  rpc ListPlugins(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc RefreshPlugins(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc ListSignals(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc ReconcileProviders(arvo.common.v1.Empty) returns (arvo.common.v1.Empty);
  // What each installed extension contributes to the picker, and any reason
  // this build cannot offer it. The front end renders the rows; whether one
  // can be run is this side's answer.
  rpc ExtensionStrategies(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  // The watchlist, and the prices that move under it. `Watchlist` also tells
  // the engine which symbols to keep the socket subscribed to, so asking for
  // the rows is what starts the ticks.
  rpc Watchlist(arvo.common.v1.Empty) returns (arvo.common.v1.View);
  rpc StreamQuotes(arvo.common.v1.Empty) returns (stream arvo.market.v1.QuoteTick);
}
