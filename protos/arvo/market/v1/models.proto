syntax = "proto3";

package arvo.market.v1;

// Instruments, prices, and asking a vendor for either.

message Instrument {
  // e.g. "AAPL.RH"
  string id = 1;
  string interval = 2;
  // ISO dates, inclusive.
  string from = 3;
  string to = 4;
}

message Instruments {
  repeated Instrument instruments = 1;
}

// One trade off the live price stream.
//
// Typed rather than a View: there are hundreds a minute, and the four fields
// are the whole of it. Display only — a tick never becomes a bar, because the
// data library is fetched files with a content hash and that hash is what
// makes a stored verdict checkable.
// One price, as it arrived.
//
// Separate from `QuoteView` and deliberately thinner: a tick carries only
// what moved. Which rows exist, and which of them you hold, is settled once
// by the `Watchlist` call — a stream that also decided the row set would make
// a socket blip look like a portfolio change.
//
// `regular` is not decoration. Outside 09:30–16:00 the stream keeps sending,
// on thin volume and wide spreads, and a pre-market print rendered
// identically to a regular-session one is a worse answer than no price at
// all. A front end marks it; it does not hide it.
message QuoteTick {
  // The bare ticker, matching `QuoteView.symbol`.
  string symbol = 1;
  double price = 2;
  // Move since the previous close, as a fraction.
  optional double change = 3;
  // Whether this print happened in the regular session.
  bool regular = 4;
}

// The control tier (ADR-0018 point 4). Behind the control token, never the
// research one: a script or an agent holding `engine.json` cannot reach it.
message InstrumentSearch {
  string query = 1;
  // The source to ask; the broker when absent.
  optional string source = 2;
}

message FetchRequest {
  string instrument = 1;
  string interval = 2;
  optional uint32 days = 3;
  optional string source = 4;
}

message CompareRequest {
  string instrument = 1;
  string interval = 2;
  optional string first = 3;
  optional string second = 4;
  optional uint32 days = 5;
}
