syntax = "proto3";

// The Arvo engine's local API (ADR-0018).
//
// This file is the research tier: reading research memory and running
// research. Nothing here names a source, a credential, an executor or an
// order, so a caller holding this tier cannot reach one — the same boundary
// ADR-0016 draws for agents, for every front end that is not the window.
// Control calls — `Sessions` below — reach an executor, and are behind a
// second token the engine writes to `control.json` beside `engine.json`.
// The Python client and the MCP server read only `engine.json`; the window
// and a CLI read both.
//
// Every call carries `authorization: Bearer <token>`.
package arvo.engine.v1;

message Empty {}

message Strategy {
  string name = 1;
  string label = 2;
  // The resolution it runs at, e.g. "1d" or "5m".
  string interval = 3;
  // What the rule claims about how prices behave.
  string premise = 4;
  // True when the rule ranks instruments against each other and needs a set.
  bool ranks_a_set = 5;
  // Backtests one study runs: what a front end's progress indicator promises.
  uint32 backtests = 6;
}

message Strategies {
  repeated Strategy strategies = 1;
}

message Instrument {
  // e.g. "AAPL.RH"
  string id = 1;
  string interval = 2;
  // ISO dates, inclusive.
  string from = 3;
  string to = 4;
}

message Instruments {
  repeated Instrument instruments = 1;
}

message FindingSummary {
  string id = 1;
  // What was run, e.g. "study", "walk-forward" or "panel".
  string kind = 2;
  string subject = 3;
  // "Supported", "NotSupported" or "Inconclusive".
  string verdict = 4;
  // RFC 3339.
  string recorded_at = 5;
  // The agent or script that ran it; empty for a person.
  string author = 6;
}

message Findings {
  repeated FindingSummary findings = 1;
  // Records in the evidence store that could not be read.
  uint32 unreadable = 2;
}

message FindingId {
  string id = 1;
}

message Advice {
  // "blocking", "warning" or "note".
  string severity = 1;
  string finding = 2;
  string action = 3;
  string evidence = 4;
}

// One finding: the verdict and how far it may be read, before any number.
message Finding {
  FindingSummary summary = 1;
  // A plain instruction on how far the verdict may be read. Read first.
  string read_this_first = 2;
  repeated string reasons = 3;
  repeated Advice advice = 4;
  // The numbers, which differ by kind: the search and the out-of-sample
  // metrics for a study, the stitched record for a walk-forward, the pooled
  // outcome for a panel. JSON, so a new number is not a new message.
  string detail_json = 5;
  // Files kept with the finding (#157).
  repeated Attachment attachments = 6;
}

// One file kept with a finding: bytes stored once by content hash, listed
// on the record.
message Attachment {
  string name = 1;
  string media_type = 2;
  // blake3 of the bytes, hex.
  string hash = 3;
  uint64 bytes = 4;
  // RFC 3339.
  string added_at = 5;
}

// A file to keep with a finding the caller already recorded or ran.
message AttachRequest {
  string finding_id = 1;
  // As the author names it: `report.md`, `equity.png`.
  string name = 2;
  // `text/markdown`, `image/png`; empty means application/octet-stream.
  string media_type = 3;
  bytes data = 4;
}

message Attachments {
  repeated Attachment attachments = 1;
}

message RunRequest {
  string instrument = 1;
  string strategy = 2;
  // Who is running this, e.g. "script:momentum-scan". Required: a run is
  // saved as this author's and deflated against everything the author has
  // run, so a script iterating until something passes does not make it pass.
  string author = 3;
  // Where in the author's code the call was made, as "path:line", so the
  // workbench can put the finding's caveats against that line. Optional.
  string origin = 4;
}

// One point of an equity curve. `at` is `YYYY-MM-DDTHH:MM:SS` or a date.
message Point {
  string at = 1;
  double equity = 2;
}

// One trade in a ledger: a round trip, or a position still open at the end
// (empty `closed`, no `exit`).
message LedgerTrade {
  // `SYMBOL.VENUE`; empty when it is the experiment's own instrument.
  string instrument = 1;
  string opened = 2;
  string closed = 3;
  // "long" or "short"; empty means long.
  string direction = 4;
  double quantity = 5;
  double entry = 6;
  optional double exit = 7;
  double pnl = 8;
  double commission = 9;
  // "signal", "stop", "halted", "expired" or "still_open"; empty means signal.
  string exit_reason = 10;
}

// Evidence an engine Arvo did not run computed (ADR-0026). What a run
// produces, before anyone concludes anything from it; Arvo computes the
// verdict. There is no field for a verdict, a metric or a p-value.
message ReportRequest {
  // As RunRequest: who is recording this, and where in their code.
  string author = 1;
  string origin = 2;
  // The hypothesis: an id, and the claim in prose.
  string hypothesis_id = 3;
  string claim = 4;
  // The experiment as data.
  string instrument = 5;
  // ISO dates, inclusive.
  string from = 6;
  string to = 7;
  // As arvo_data spells it: "1day", "5minute".
  string interval = 8;
  // The engine's own dataset: an id, and a content hash of what it read.
  string dataset_id = 9;
  string dataset_version = 10;
  // "split" (the default) or "total_return".
  string adjustment = 11;
  // The engine's own strategy name, and its parameters.
  string strategy = 12;
  map<string, double> params = 13;
  // The cost model the run assumed.
  double commission_bps = 14;
  double slippage_bps = 15;
  double per_fill = 16;
  // The risk model, as far as the run assumed one.
  optional double stop_atr_multiple = 17;
  // Zero means the curve's first point.
  double starting_cash = 18;
  // What computed this, by name and version.
  string engine = 19;
  // The evidence.
  repeated Point strategy_curve = 20;
  repeated LedgerTrade ledger = 21;
  // Buy-and-hold over the same window and capital. Without it the finding
  // is Inconclusive: a return with nothing to beat is not a result.
  repeated Point benchmark_curve = 22;
  // How many trials the author's whole search has run (ADR-0014).
  optional uint32 trials = 23;
}

// A ruleset parameter: one value fixes it, several search it.
message Param {
  string name = 1;
  repeated double values = 2;
}

message Fixed {
  string name = 1;
  double value = 2;
}

// One file under <project>/rulesets/, as the picker sees it.
message Ruleset {
  string path = 1;
  string name = 2;
  string label = 3;
  string rule = 4;
  string interval = 5;
  uint32 searches = 6;
  // Why it cannot be run, when it cannot.
  optional string problem = 7;
}

message Rulesets {
  repeated Ruleset rulesets = 1;
}

message RulesetPath {
  string path = 1;
}

// A grid ruleset's parts, for a form.
message RulesetForm {
  string name = 1;
  string rule = 2;
  string label = 3;
  string premise = 4;
  repeated Param params = 5;
}

// A rule this build implements, with the search it ships.
message Rule {
  string name = 1;
  string label = 2;
  string premise = 3;
  string interval = 4;
  repeated Fixed fixed = 5;
  repeated Param axes = 6;
  bool ranks_a_set = 7;
  bool trades_options = 8;
}

message Rules {
  repeated Rule rules = 1;
}

// The project's risk file (.arvo/risk.json), as read for the next study.
message RiskModel {
  string path = 1;
  bool exists = 2;
  // The model in force, as JSON: the file's when it reads, the shipped one
  // when it does not.
  string model_json = 3;
  // Why the file was refused, when it was.
  optional string error = 4;
}

// A workbench view, as `arvo_views` serialises it. Carried whole: the window
// renders these shapes and links the crate that defines them, so it decodes
// one field instead of the proto restating two thousand lines of view types.
// `kind` names the type, for a reader without the crate.
message View {
  string kind = 1;
  string json = 2;
}

message StudyRequest {
  string instrument = 1;
  // A rule or ruleset name; the default rule when absent.
  optional string strategy = 2;
}

message BookRequest {
  repeated string instruments = 1;
  optional string strategy = 2;
  optional uint32 max_concurrent_positions = 3;
  optional uint32 max_per_sector = 4;
}

message FindingIds {
  repeated string ids = 1;
}

service Research {
  rpc ListStrategies(Empty) returns (Strategies);
  rpc ListInstruments(Empty) returns (Instruments);
  rpc ListFindings(Empty) returns (Findings);
  rpc OpenFinding(FindingId) returns (Finding);
  // Search a strategy's grid on one instrument, choose in-sample, judge
  // out-of-sample. Seconds to a minute.
  rpc RunStudy(RunRequest) returns (Finding);
  // Re-select on a rolling schedule across the whole history. Slower by
  // roughly the number of folds.
  rpc RunWalkForward(RunRequest) returns (Finding);
  // Record evidence computed elsewhere. Arvo judges it with a study's
  // criteria, saves it as the author's finding held to the author's whole
  // search, and answers with the finding it made of it (ADR-0026).
  rpc RecordFinding(ReportRequest) returns (Finding);
  // Keep a file with a finding: a report, a figure, the trades. Stored once
  // by content hash; the finding lists it (#157).
  rpc AttachFile(AttachRequest) returns (Attachments);
  // The project's rulesets and the rules they may search (#146, #127).
  rpc ListRulesets(Empty) returns (Rulesets);
  rpc ReadRuleset(RulesetPath) returns (RulesetForm);
  rpc WriteRuleset(RulesetForm) returns (Ruleset);
  rpc ListRules(Empty) returns (Rules);
  rpc GetRiskModel(Empty) returns (RiskModel);
  // The workbench's own views (#127 stage 2): what the window renders, from
  // the same runs an agent's RunStudy performs.
  rpc ViewStudy(StudyRequest) returns (View);
  rpc ViewWalkForward(StudyRequest) returns (View);
  rpc ViewPanel(Empty) returns (View);
  rpc ViewBook(BookRequest) returns (View);
  rpc ViewHistory(Empty) returns (View);
  rpc ViewRecord(FindingId) returns (View);
  rpc ViewReplay(FindingId) returns (View);
  rpc ViewComparison(FindingIds) returns (View);
  rpc ViewProblems(Empty) returns (View);
  rpc ListAttachments(FindingId) returns (Attachments);
  // What happened, as it happens: every event the engine raises, as a View
  // of kind EventView (#150). A session changing state is the first.
  rpc Subscribe(Empty) returns (stream View);
}

// ---------------------------------------------------------------- control --

message StartRequest {
  // The finding whose rule runs: its selected experiment, warmed on the
  // library from the finding's own start to today.
  string finding = 1;
  // `alpaca-paper`, `alpaca-live`, or `robinhood-<last four>`.
  string executor = 2;
}

message SessionId {
  string id = 1;
}

message SessionStatus {
  string id = 1;
  string finding = 2;
  string executor = 3;
  string instrument = 4;
  string strategy = 5;
  string started_at = 6;
  // starting, running, halted, stopped or failed.
  string state = 7;
  uint32 signals = 8;
  uint32 submitted = 9;
  uint32 refused = 10;
  uint32 fills = 11;
  // Why the gate halted, when it did.
  optional string halted = 12;
  optional string last_error = 13;
  optional string last_bar = 14;
}

message SessionList {
  repeated SessionStatus sessions = 1;
}

// The control tier (ADR-0018 point 4). Behind the control token, never the
// research one: a script or an agent holding `engine.json` cannot reach it.
message InstrumentSearch {
  string query = 1;
  // The source to ask; the broker when absent.
  optional string source = 2;
}

message FetchRequest {
  string instrument = 1;
  string interval = 2;
  optional uint32 days = 3;
  optional string source = 4;
}

message CompareRequest {
  string instrument = 1;
  string interval = 2;
  optional string first = 3;
  optional string second = 4;
  optional uint32 days = 5;
}

// A file the engine wrote, for a front end to reveal or open. A path rather
// than bytes: the engine is one process per user on this machine (ADR-0018),
// so a path means the same thing on both sides, and an export exists on disk
// precisely so a person can find it twice.
message ExportedPath {
  string path = 1;
}

message SharedExperiment {
  // The file's text, as the person pasted or opened it.
  string text = 1;
  string instrument = 2;
}

message TradeExport {
  string name = 1;
  // The rows as the front end has them, in the order it is showing them:
  // `Vec<TradeRowExport>` as JSON. The engine does not derive these from the
  // finding, because the sort order is the view's.
  string rows_json = 2;
}

message ReportFigure {
  string finding_id = 1;
  // The equity chart the front end captured, base64 PNG. Absent is a report
  // with no figure, not an error: only a window can draw one.
  optional string figure = 2;
}

message AttachmentRef {
  string finding_id = 1;
  string hash = 2;
}

message JobId {
  string id = 1;
}

message PortfolioName {
  string name = 1;
}

message VendorId {
  string vendor = 1;
}

message SignIn {
  // Where to send the person. The caller opens it: the engine binds the
  // loopback listener and exchanges the code, but opening a browser is the
  // front end's job (ADR-0028).
  string url = 1;
}

message VendorProfile {
  string vendor = 1;
  // Which sub-account, for a vendor that has them (Alpaca's paper and live).
  optional string profile = 2;
}

message AccountKeys {
  string vendor = 1;
  optional string profile = 2;
  string key_id = 3;
  string secret = 4;
}

// The data library and the sources that fill it.
//
// Behind the control token, not the research one. Fetching changes the
// library and makes existing findings stale, which is a person's decision
// (ADR-0016); an agent holding engine.json cannot reach any of this.
service Data {
  rpc ViewLibrary(Empty) returns (View);
  rpc ListSources(Empty) returns (View);
  rpc SearchInstruments(InstrumentSearch) returns (View);
  rpc FetchBars(FetchRequest) returns (View);
  rpc CompareSources(CompareRequest) returns (View);
  // Accounts and their credentials (ADR-0028). The engine holds every
  // credential; BeginSignIn answers with a URL and reports the outcome as an
  // event rather than making the caller wait for a person.
  rpc ListAccounts(Empty) returns (View);
  rpc BeginSignIn(VendorId) returns (SignIn);
  rpc DisconnectAccount(VendorProfile) returns (Empty);
  rpc StoreAccountKeys(AccountKeys) returns (Empty);
  // Holdings: files the person exported, or ones a connected vendor wrote.
  // Read-only; nothing here places, cancels or modifies an order.
  rpc ListPortfolios(Empty) returns (View);
  rpc SyncAccounts(Empty) returns (View);
  rpc SyncPortfolio(PortfolioName) returns (View);
  // Running an imported experiment, and the files a finding turns into. Each
  // export answers with a path the caller reveals; the engine writes, the
  // front end shows.
  rpc RunSharedExperiment(SharedExperiment) returns (View);
  rpc ExportTrades(TradeExport) returns (ExportedPath);
  rpc ExportExperiment(FindingId) returns (ExportedPath);
  rpc ComposeReport(ReportFigure) returns (ExportedPath);
  rpc AttachmentPath(AttachmentRef) returns (ExportedPath);
  // The engine's own background jobs. A front end shows these beside its own:
  // a job lives where its work does, and the list is a merge.
  rpc ListJobs(Empty) returns (View);
  rpc RunJob(JobId) returns (Empty);
  // The plugins this engine hosts (ADR-0029). It probes them, supervises them,
  // and holds the credential each call may use; a front end reads and asks for
  // a reconcile after it has changed what is installed.
  rpc ListPlugins(Empty) returns (View);
  rpc RefreshPlugins(Empty) returns (View);
  rpc ListSignals(Empty) returns (View);
  rpc ReconcileProviders(Empty) returns (Empty);
}

service Sessions {
  // Starts a finding's rule against a venue. Answers as soon as the session
  // thread is up; a finding that cannot run shows as `failed` in ListSessions.
  rpc StartSession(StartRequest) returns (SessionStatus);
  // Stops after the current poll. Positions are left as they are.
  rpc StopSession(SessionId) returns (SessionStatus);
  rpc ListSessions(Empty) returns (SessionList);
}
