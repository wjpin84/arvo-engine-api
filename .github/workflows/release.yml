# A release: a tag vX.Y.Z pushed to this repository. Verifies everything CI
# verifies, checks the tag is the version the files say, then publishes
# arvo-api, arvo-client and the Python package in that order and cuts the
# GitHub release from the changelog. See VERSIONING.md, "How to cut one".
#
# Needs, once, on the repository:
#   - secret CARGO_REGISTRY_TOKEN: a crates.io token allowed to publish
#     arvo-api and arvo-client;
#   - PyPI trusted publishing for the project `arvo-client`, publisher
#     wjpin84/arvo-engine-api, workflow release.yml, environment `pypi`
#     (no secret: the job's OIDC token is the credential).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    name: the tag is the version
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust/Cargo.toml, python/pyproject.toml and CHANGELOG.md agree with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          rust=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          python=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)
          echo "tag $tag, rust $rust, python $python"
          [ "$rust" = "$tag" ] || { echo "::error::rust/Cargo.toml says $rust, the tag says $tag"; exit 1; }
          [ "$python" = "$tag" ] || { echo "::error::python/pyproject.toml says $python, the tag says $tag"; exit 1; }
          grep -q "^## $tag" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $tag' section"; exit 1; }
          ! grep -q "^## Unreleased" CHANGELOG.md || { echo "::error::CHANGELOG.md still has an Unreleased section; move it under $tag"; exit 1; }

  crates:
    name: publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: arvo-api, then arvo-client
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # cargo publish waits for the index to carry the crate before
        # returning, so arvo-client's exact dependency on arvo-api resolves.
        run: |
          cargo publish -p arvo-api --locked
          cargo publish -p arvo-client --locked

  pypi:
    name: publish to PyPI
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: build the wheel and the sdist
        working-directory: python
        run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  github-release:
    name: the GitHub release
    needs: [crates, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: this version's changelog section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v tag="$tag" '
            $0 ~ "^## " tag { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          name: ${{ github.ref_name }}
