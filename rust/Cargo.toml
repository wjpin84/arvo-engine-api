[workspace]
resolver = "2"
members = ["arvo-api", "arvo-client", "generate"]

# One version for the protos and every binding of them. Bump it here and in
# ../python/pyproject.toml together; see ../VERSIONING.md for which part.
[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/wjpin84/arvo-engine-api"

[workspace.dependencies]
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tonic = "0.14.6"
tonic-prost = "0.14.6"
